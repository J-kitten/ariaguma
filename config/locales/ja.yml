ja:
  activerecord:
    format: "%{attribute}%{message}"
    errors:
      messages:
      blank: "を入力してください"
      confirmation: "が一致していません"
      too_short: "は%{count}文字以上で入力してください"
      too_long: "は%{count}文字以内で入力してください"
      invalid: "の形式が正しくありません"
      taken: "はすでに使用されています"
      record_invalid: "バリデーションに失敗しました: %{errors}"
    models:
      regist: 登録
      contact: お問い合わせ
    attributes:
      regist:
        name: お名前
        email: メールアドレス
        email_confirmation: メールアドレス（確認用）
        message: メッセージ
      contact:
        name: お名前
        email: メールアドレス
        email_confirmation: メールアドレス（確認用）
        subject: 件名
        message: メッセージ

  errors:
    messages:
      blank: "を入力してください"
      confirmation: "メールアドレスが一致していません"

  time:
    formats:
      short: "%Y/%m/%d %H:%M"
      long: "%Y年%m月%d日(%a) %H時%M分"
      default: "%Y/%m/%d %H:%M:%S"

  date:
    formats:
      default: "%Y/%m/%d"
      short: "%m/%d"
      long: "%Y年%m月%d日(%a)"
    day_names: [日曜日, 月曜日, 火曜日, 水曜日, 木曜日, 金曜日, 土曜日]
    abbr_day_names: [日, 月, 火, 水, 木, 金, 土]
    month_names: [~, 1月, 2月, 3月, 4月, 5月, 6月, 7月, 8月, 9月, 10月, 11月, 12月]
    abbr_month_names: [~, 1月, 2月, 3月, 4月, 5月, 6月, 7月, 8月, 9月, 10月, 11月, 12月]